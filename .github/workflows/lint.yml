name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      # Report both packages even if one fails.
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      # Fails on errors only; warnings (e.g. the fetch-on-mount set-state-in-effect ones) are reported but allowed.
      - run: npm run lint
